name: cicd pipeline

on:
  push:
    branches:
      - feat/upgrade-open-source

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.9.0

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Setup database
        run: |
          cd backend
          npm run setup

      - name: Run tests
        run: |
          cd backend
          npm run dev

      - name: Deployment status
        run: echo "Deployment successful"

  frontend_deploy:
    runs-on: self-hosted

    steps:
      - name: checkout clone
        uses: actions/checkout@v4

      - name: install node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.9.0

      - name: Install dependencies
        run: npm ci

      - name: cache dependencies
        uses: actions/cache@v4
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hostFiles('**/package-locke.json') }}

      - name: run dev
        run: echo "deployment complete" && npm run dev
